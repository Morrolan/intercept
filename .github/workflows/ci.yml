name: CI

# Pushes to a PR branch fired both triggers, running every job twice.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same PR or branch instead of letting them
# pile up and starve each other of runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: ["a-l", "m-z"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Run tests (${{ matrix.group }})
        run: |
          if [ "${{ matrix.group }}" = "a-l" ]; then
            pytest tests/test_[a-l]*.py --tb=short -q --timeout=120 --timeout-method=thread
          else
            pytest tests/test_[m-z]*.py --tb=short -q --timeout=120 --timeout-method=thread
          fi

  # Every page and mode opened in headless Chromium; fails on JavaScript errors
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/smoke --tb=short -q --timeout=300 --timeout-method=thread
