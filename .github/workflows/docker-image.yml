name: Build and Push Docker Image

# Automatic publication uses the exact main revision whose complete CI passed.
# Manual builds are restricted to main and allow additional architectures on demand.
on:
  workflow_dispatch:
    inputs:
      amd64:
        description: 'Also build linux/amd64 (arm64, which tyr runs, is always built)'
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

# Multi-arch image builds are the most expensive jobs in this repo. Without
# this, every push to a PR branch left the previous build running, and enough
# of them in flight starved the test jobs of runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Set permissions for GITHUB_TOKEN
permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Native arm64 runner (free for public repos): no QEMU for the image tyr runs (it took ~3h45m)
    runs-on: ubuntu-24.04-arm

    steps:
      # Step 1: Check out the repository code
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Step 2: QEMU, only for an extra amd64 build
      - name: Set up QEMU
        if: inputs.amd64
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      # Step 3: Set up Docker Buildx for advanced features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Step 4: Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 5: Generate tags and labels from Git metadata
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}

      # Step 6: Build and push the Docker image
      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: ${{ inputs.amd64 && 'linux/arm64,linux/amd64' || 'linux/arm64' }}
          # Publish the successful CI revision, or the manually selected main revision
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Enable build cache for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
